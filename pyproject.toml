[project]
name = "kundasang-resilience-digital-twin"
version = "0.1.0"
description = "Kundasang Resilience Digital Twin monorepo"
readme = "README.md"
requires-python = "==3.13.14"
license = { text = "Apache-2.0" }
dependencies = []

[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "mypy>=1.15.0,<2",
    "pytest>=8.3.0,<9",
    "ruff>=0.15.22,<0.16",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["apps/api/src", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "scripts/tests"]
pythonpath = ["apps/api/src", "scripts"]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["apps/api/src", "scripts"]

[tool.ruff.lint.per-file-ignores]
"apps/api/migrations/**" = ["E501", "UP035", "UP007"]

[[tool.mypy.overrides]]
module = ["tests.*", "apps.api.tests.*", "scripts.tests.*"]
disallow_untyped_defs = false
