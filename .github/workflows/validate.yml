name: Validate

on:
  pull_request:
  push:
    branches: [main, gate-0-foundation]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-ubuntu:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5.4.1
        with:
          version: 0.11.32
          enable-cache: true
          python-version: "3.13.14"
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Install Docker Compose services
        run: docker compose -f infra/compose.yaml up -d
      - name: Run canonical validation
        run: uv run --frozen python scripts/validate.py
      - name: Upload validation logs on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: validate-logs-ubuntu
          path: |
            **/pytest-cache-files-*
            **/.pytest_cache

  validate-windows:
    runs-on: windows-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5.4.1
        with:
          version: 0.11.32
          enable-cache: true
          python-version: "3.13.14"
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.14.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: "24.18.0"
          cache: pnpm
      - name: Run fast validation
        run: uv run --frozen python scripts/validate.py --fast
